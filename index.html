<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I call you?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29, #2b32b2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .phone-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #btn-yes {
            background-color: #4cd137;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 209, 55, 0.4);
        }

        #btn-yes:hover {
            background-color: #44bd32;
            transform: scale(1.05);
        }

        #btn-no {
            background-color: #e84118;
            color: white;
            box-shadow: 0 4px 15px rgba(232, 65, 24, 0.4);
            position: absolute;
            transition: 0.2s ease-out;
        }

        /* Khung hiển thị tin nhắn ẩn */
        .hidden-message {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #4cd137;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            pointer-events: none;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .hidden-message.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="phone-icon">📞</div>
        <h1>Can I call you?</h1>
        
        <div class="buttons">
            <button id="btn-yes" onclick="handleYesClick()">Có chứ!</button>
            <button id="btn-no" onmouseover="moveButton()" onclick="moveButton()">Không</button>
        </div>

        <div id="secret-box" class="hidden-message">
            <strong>✨ Tin nhắn ẩn:</strong> <span id="secret-text">Đang kết nối vào phòng gọi... Chuẩn bị nghe máy nhé! 😉</span>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const secretBox = document.getElementById('secret-box');

        // Hàm né chuột của nút "Không"
        function moveButton() {
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            
            const maxX = rect.width - btnNo.offsetWidth - 40;
            const maxY = rect.height - btnNo.offsetHeight - 40;
            
            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Hàm xử lý khi bấm nút "Có chứ!"
        function handleYesClick() {
            btnNo.style.display = 'none';
            secretBox.classList.add('show');
            document.querySelector('h1').innerText = "Đang vào cuộc gọi... ❤️";
            document.querySelector('.phone-icon').innerText = "💖";
            
            // Sau 1.5 giây (để kịp hiện hiệu ứng tin nhắn), trang web sẽ tự động chuyển hướng sang Google Meet
            setTimeout(function() {
                window.location.href = "https://meet.google.com/sfc-vdss-sat";
            }, 1500);
        }
    </script>

</body>
</html>
